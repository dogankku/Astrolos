<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Astrolos · Birth Chart, Daily Horoscope & Compatibility</title>
<meta name="description" content="Get your free birth chart, read your daily horoscope and discover your compatibility. Calculated from real sky data." />
<meta name="theme-color" content="#0c0a24" />
<meta property="og:title" content="Astrolos · The language of the stars, your story" />
<meta property="og:description" content="Free birth chart, daily horoscopes and relationship compatibility." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230c0a24'/%3E%3Cpath d='M32 10l4 18 18 4-18 4-4 18-4-18-18-4 18-4z' fill='%23e8c27a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<script src="vendor/astronomy.browser.min.js"></script>
<script src="i18n.js"></script>
<style>
:root{
  --bg:#0c0a24; --bg2:#15123a; --ink:#f3efff; --ink2:#b9b3d9; --ink3:#857fae;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08); --line:rgba(255,255,255,.1);
  --gold:#e8c27a; --gold2:#f5dca8; --lilac:#b9a6ff; --rose:#ff8fa3; --teal:#7fd6c2; --sky:#8ec5ff;
  --fire:#ff9a6b; --earth:#c8d68a; --air:#9fd3ff; --water:#a99bff;
  --radius:22px; --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --font-d:'Fraunces',Georgia,serif; --font-b:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme="light"]{
  --bg:#f6f1e7; --bg2:#ede4d3; --ink:#1d1838; --ink2:#4a4468; --ink3:#7a7496;
  --card:rgba(255,255,255,.65); --card2:rgba(255,255,255,.9); --line:rgba(29,24,56,.12);
  --gold:#a8792b; --gold2:#8a5f18; --lilac:#6a55d8; --rose:#d4466a; --teal:#1f8f7a; --sky:#2f74c0;
  --fire:#d9622e; --earth:#6f8a2a; --air:#2f86c9; --water:#6a55d8;
  --shadow:0 20px 50px -25px rgba(60,40,10,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-b);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1200px 700px at 85% -10%, rgba(185,166,255,.22), transparent 60%),
  radial-gradient(900px 600px at -10% 30%, rgba(232,194,122,.10), transparent 60%),
  radial-gradient(1000px 800px at 50% 120%, rgba(127,214,194,.10), transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2))}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
[data-theme="light"] #stars{opacity:.25}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
.glyph{font-family:"Segoe UI Symbol","Noto Sans Symbols","Apple Symbols",sans-serif;font-variant-emoji:text}

/* header */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-d);font-size:1.45rem;font-weight:700}
.logo-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,var(--gold2),var(--gold) 55%,#8a6a2c);color:#1b1533;font-size:1rem;box-shadow:0 0 24px rgba(232,194,122,.45)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;padding:9px 14px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:.93rem;transition:.2s}
.nav a:hover{color:var(--ink);background:var(--card)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--card2)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.lang-btn{font-weight:800;font-size:.78rem;letter-spacing:.04em}

/* bottom nav mobile */
.tabbar{display:none}
@media (max-width:820px){
  .nav{display:none}
  .topbar .lang-btn{margin-left:auto}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:.7rem;font-weight:600;color:var(--ink3);padding:6px 0;border-radius:12px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--gold)}
  main{padding-bottom:90px}
}

/* generic */
.page{display:none;animation:fade .45s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section.block{padding:28px 0}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.lead{color:var(--ink2);font-size:1.05rem;max-width:60ch}
.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:680px){.g2,.g3{grid-template-columns:1fr}}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.5rem,3vw,2rem)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;transition:transform .15s, background .2s, box-shadow .2s}
.btn:hover{transform:translateY(-1px);background:var(--card2)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1533;border-color:transparent;box-shadow:0 10px 30px -10px rgba(232,194,122,.7)}
[data-theme="light"] .btn.primary{color:#fff;background:linear-gradient(135deg,#c79a4b,#9a6b22)}
.btn.small{padding:8px 14px;font-size:.88rem}
.btn:disabled{opacity:.6;cursor:wait}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.pill.r{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,transparent)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:56px 0 30px}
.hero h1{font-size:clamp(2.3rem,5.6vw,4.1rem);font-weight:600}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero .lead{margin:18px 0 26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;margin-top:26px;color:var(--ink3);font-size:.86rem;flex-wrap:wrap}
.trust span::before{content:"✦ ";color:var(--gold)}
.hero-art{position:relative;aspect-ratio:1;max-width:460px;width:100%;justify-self:center}
.hero-art .ring{position:absolute;inset:0;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art .center{position:absolute;inset:30%;display:grid;place-items:center;text-align:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px}.hero-art{max-width:300px;order:-1}}
@media (prefers-reduced-motion:reduce){.hero-art .ring{animation:none}.page{animation:none}}

/* personal banner */
.me-banner{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,rgba(232,194,122,.14),rgba(185,166,255,.12));}
.me-banner .big-glyph{font-size:2.6rem;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--gold)}
@media (max-width:620px){.me-banner{grid-template-columns:auto 1fr}.me-banner .btn{grid-column:1/-1}}

/* sky cards */
.sky-card{display:flex;flex-direction:column;gap:6px;min-height:150px}
.sky-card .label{font-size:.78rem;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sky-card .val{font-family:var(--font-d);font-size:1.45rem;font-weight:600}
.sky-card .sub{color:var(--ink2);font-size:.9rem}
.moon-svg{width:56px;height:56px}

/* zodiac picker */
.zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media (max-width:820px){.zgrid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.zgrid{grid-template-columns:repeat(3,1fr)}}
.zbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:.2s;text-decoration:none}
.zbtn:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:var(--card2)}
.zbtn .glyph{font-size:1.9rem;line-height:1}
.zbtn b{font-size:.95rem}
.zbtn small{font-size:.7rem;color:var(--ink3)}
.el-fire .glyph{color:var(--fire)}.el-earth .glyph{color:var(--earth)}.el-air .glyph{color:var(--air)}.el-water .glyph{color:var(--water)}

.feature{display:flex;flex-direction:column;gap:10px}
.feature .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card2);font-size:1.3rem;color:var(--gold)}
.feature h3{font-size:1.25rem}
.feature p{margin:0;color:var(--ink2)}
.feature a{margin-top:auto;font-weight:700;color:var(--gold);text-decoration:none}

/* horoscope page */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;scroll-snap-type:x mandatory}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.9rem;scroll-snap-align:start}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1533;border-color:transparent}
[data-theme="light"] .chip[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,#c79a4b,#9a6b22)}
.sign-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin:10px 0 18px}
.sign-hero .glyph-xl{font-size:3.4rem;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--card2),transparent 70%);border:1px solid var(--line)}
.sign-hero h2{font-size:clamp(2rem,4vw,2.8rem)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:inline-flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 18px;border-radius:999px;border:0;background:transparent;font-weight:700;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--card2);color:var(--ink)}
.horo-main{font-family:var(--font-d);font-size:1.25rem;line-height:1.5;margin:6px 0 0}
.cat{display:flex;flex-direction:column;gap:8px}
.cat-head{display:flex;justify-content:space-between;align-items:center}
.cat-head b{font-size:1.02rem}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem}
.stars .off{color:var(--line)}
.cat p{margin:0;color:var(--ink2)}
.lucky{display:flex;gap:14px;flex-wrap:wrap}
.lucky>div{flex:1;min-width:130px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.lucky span{display:block;font-size:.75rem;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lucky b{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.swatch{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.trait-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.trait-list span{padding:6px 12px;border-radius:999px;background:var(--card2);font-size:.85rem;border:1px solid var(--line)}

/* forms */
.form{display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.form .row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.inp,select.inp{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-weight:500;color-scheme:dark}
[data-theme="light"] .inp{color-scheme:light}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink2);font-weight:600}
.check input{accent-color:var(--gold);width:18px;height:18px}
.city{position:relative}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:280px;overflow-y:auto}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:left;padding:11px 14px;border:0;background:transparent;border-bottom:1px solid var(--line);font-size:.9rem}
.dropdown button:hover,.dropdown button.hl{background:var(--card2)}
.dropdown small{display:block;color:var(--ink3);font-size:.76rem}
.city-ok{font-size:.78rem;color:var(--teal);font-weight:600;min-height:1em}
details.adv{border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
details.adv summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--ink2)}
details.adv .row{margin-top:12px}
.err{color:var(--rose);font-weight:600;font-size:.9rem;min-height:1.2em}
.note{font-size:.85rem;color:var(--ink3)}

/* chart page */
.chart-layout{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
@media (max-width:980px){.chart-layout{grid-template-columns:1fr}}
.empty-state{text-align:center;padding:48px 22px}
.empty-state .glyph{font-size:3rem;color:var(--gold)}
.wheel-box{position:relative}
.wheel-box svg{width:100%;max-width:640px;margin:0 auto;height:auto;display:block}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:680px){.big3{grid-template-columns:1fr}}
.b3{padding:18px;border-radius:18px;background:var(--card2);border:1px solid var(--line)}
.b3 .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--ink3)}
.b3 .v{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:1.45rem;font-weight:600;margin:4px 0 8px}
.b3 .v .glyph{color:var(--gold)}
.b3 p{margin:0;font-size:.92rem;color:var(--ink2)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:10px;font-size:.88rem;font-weight:600}
.bar .track{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;transition:width .8s ease}
.planet-list{display:grid;gap:10px}
.pl{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.pl .pg{font-size:1.6rem;color:var(--gold);text-align:center;line-height:44px}
.pl .t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.pl .t .deg{font-weight:600;color:var(--ink3);font-size:.86rem}
.pl p{margin:4px 0 0;font-size:.92rem;color:var(--ink2)}
.asp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.asp:last-child{border-bottom:0}
.asp .sym{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:1.05rem;background:var(--card2)}
.asp .sym.h{color:var(--teal)} .asp .sym.c{color:var(--rose)} .asp .sym.n{color:var(--gold)}
.asp b{display:block}
.asp p{margin:2px 0 0;font-size:.9rem;color:var(--ink2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* compat */
.score-wrap{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media (max-width:620px){.score-wrap{grid-template-columns:1fr;justify-items:center;text-align:center}}
.score-ring{width:170px;height:170px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:2.6rem;font-weight:700}
.score-ring .num small{display:block;font-size:.8rem;font-family:var(--font-b);color:var(--ink3);font-weight:600;text-align:center;margin-top:-6px}
.vs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vs select{flex:1;min-width:140px}
.vs .heart{font-size:1.4rem;color:var(--rose)}
.saved{display:grid;gap:10px}
.saved-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.saved-item .glyph{font-size:1.6rem;color:var(--gold);width:40px;text-align:center}
.saved-item .grow{flex:1;min-width:0}
.saved-item b{display:block}
.saved-item small{color:var(--ink3)}
footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 40px;color:var(--ink3);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#bugun" data-i18n-aria="homeAria"><span class="logo-mark">✦</span>Astrolos</a>
    <nav class="nav" data-i18n-aria="mainMenu">
      <a href="#bugun" data-nav="bugun" data-i18n="navToday"></a>
      <a href="#burclar" data-nav="burclar" data-i18n="navSigns"></a>
      <a href="#harita" data-nav="harita" data-i18n="navChart"></a>
      <a href="#uyum" data-nav="uyum" data-i18n="navCompat"></a>
      <a href="#profil" data-nav="profil" data-i18n="navMine"></a>
    </nav>
    <button class="icon-btn lang-btn" id="langBtn" data-i18n-aria="langAria"><span data-i18n="langBtn"></span></button>
    <button class="icon-btn" id="themeBtn" data-i18n-aria="themeAria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
<!-- ============ TODAY ============ -->
<div class="page" id="page-bugun">
  <div class="wrap">
    <div class="hero">
      <div>
        <div class="eyebrow" id="todayLabel"></div>
        <h1 style="margin-top:10px" data-i18n="heroTitle"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="hero-cta">
          <a class="btn primary" href="#harita" data-i18n="ctaChart"></a>
          <a class="btn" href="#burclar" data-i18n="ctaHoro"></a>
        </div>
        <div class="trust"><span data-i18n="trust1"></span><span data-i18n="trust2"></span><span data-i18n="trust3"></span></div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg class="ring" id="heroRing" viewBox="0 0 400 400"></svg>
        <div class="center"><div id="heroMoon"></div></div>
      </div>
    </div>

    <div id="meBanner"></div>

function tzOffsetMs(tz, date){
  const p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(date);

  return Date.UTC(v('year'), v('month')-1, v('day'), v('hour') % 24, v('minute'), v('second')) - date.getTime();
}
function zonedToUtc(dateStr, timeStr, tz){
  const [y,m,d] = dateStr.split('-').map(Number); const [hh,mm] = (timeStr || '12:00').split(':').map(Number);
  const wall = Date.UTC(y, m-1, d, hh, mm);
  let t = wall;
  for (let i = 0; i < 3; i++) t = wall - tzOffsetMs(tz, new Date(t));
  return new Date(t);
}
function guessTz(cc, lon){
  cc = (cc || '').toLowerCase();
  if (TZ_COUNTRY[cc]) return TZ_COUNTRY[cc];
  if (TZ_MULTI[cc]) return TZ_MULTI[cc].reduce((b, z) => Math.abs(z[1]-lon) < Math.abs(b[1]-lon) ? z : b)[0];
  const off = Math.round(lon / 15);
  return off === 0 ? 'UTC' : `Etc/GMT${off > 0 ? '-' : '+'}${Math.abs(off)}`;
}

function obliquity(date){ const T = (date.getTime()/86400000 + 2440587.5 - 2451545.0) / 36525; return 23.439291111 - 0.013004167*T - 1.64e-7*T*T + 5.04e-7*T*T*T; }
function ayanamsa(date){ return 23.853 + (date.getUTCFullYear() + date.getUTCMonth()/12 - 2000) * 0.013969; }
function angles(date, lat, lon){
  const ramc = norm(Astronomy.SiderealTime(date) * 15 + lon) * Math.PI/180;
  const e = obliquity(date) * Math.PI/180, f = lat * Math.PI/180;
  const asc = norm(Math.atan2(Math.cos(ramc), -(Math.sin(ramc)*Math.cos(e) + Math.tan(f)*Math.sin(e))) * 180/Math.PI);
  const mc = norm(Math.atan2(Math.sin(ramc), Math.cos(ramc)*Math.cos(e)) * 180/Math.PI);
  return {asc, mc};
}
function bodyLon(name, date){
  if (name === 'Moon') return Astronomy.EclipticGeoMoon(date).lon;
  if (name === 'Sun') return Astronomy.SunPosition(date).elon;
  return Astronomy.Ecliptic(Astronomy.GeoVector(Astronomy.Body[name], date, true)).elon;
}
function planetPositions(date, sidereal=false){
  const later = new Date(date.getTime() + 6*3600000);
  const ay = sidereal ? ayanamsa(date) : 0;
  return PLANETS.map(p => {
    const l1 = bodyLon(p.k, date), l2 = bodyLon(p.k, later);
    let sp = l2 - l1; if (sp > 180) sp -= 360; if (sp < -180) sp += 360;
    const lon = norm(l1 - ay);
    return {...p, lon, sign: signIdx(lon), retro: sp < 0 && p.k !== 'Sun' && p.k !== 'Moon'};
  });
}
function findAspect(a, b, orbScale=1){
  let d = Math.abs(norm(a) - norm(b)); if (d > 180) d = 360 - d;
  for (const asp of ASPECTS){ const o = Math.abs(d - asp.a); if (o <= asp.orb * orbScale) return {...asp, exact:o}; }
  return null;
}
function computeChart(input){
  const date = zonedToUtc(input.date, input.noTime ? '12:00' : input.time, input.tz);
  const sid = input.zodiac === 'sidereal';
  const planets = planetPositions(date, sid);
  let asc = null, mc = null, cusps = null;
  if (!input.noTime){
    const an = angles(date, input.lat, input.lon);
    const ay = sid ? ayanamsa(date) : 0;
    asc = norm(an.asc - ay); mc = norm(an.mc - ay);
    const start = input.house === 'equal' ? asc : signIdx(asc) * 30;
    cusps = Array.from({length:12}, (_, i) => norm(start + i*30));
    planets.forEach(p => { p.house = Math.floor(norm(p.lon - start) / 30) + 1; });
  }
  const aspects = [];
  for (let i = 0; i < planets.length; i++) for (let j = i+1; j < planets.length; j++){
    if (i >= 7 && j >= 7) continue; // dış gezegenler arası (kuşak açıları) atla
    const a = findAspect(planets[i].lon, planets[j].lon);
    if (a) aspects.push({p1:planets[i], p2:planets[j], ...a});
  }
  aspects.sort((x, y) => (x.exact - y.exact));
  return {input, date, planets, asc, mc, cusps, aspects};
}

function moonSvg(phaseDeg, size=56){
  const r = size/2 - 2, c = size/2;
  const k = Math.cos(phaseDeg * Math.PI/180); // 1 yeni ay, -1 dolunay
  const waxing = phaseDeg < 180;
  const rx = Math.abs(k) * r;
  const sweepOuter = waxing ? 1 : 0;
  const sweepInner = (k > 0) === waxing ? 0 : 1;
  const lit = `M ${c} ${c-r} A ${r} ${r} 0 0 ${sweepOuter} ${c} ${c+r} A ${rx} ${r} 0 0 ${sweepInner} ${c} ${c-r} Z`;
  return `<svg class="moon-svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <defs><radialGradient id="mg${size}" cx="40%" cy="35%"><stop offset="0" stop-color="#fff8e6"/><stop offset="1" stop-color="#e8c27a"/></radialGradient></defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="var(--ink3)" fill-opacity=".22" stroke="var(--ink3)" stroke-opacity=".35"/>
    <path d="${lit}" fill="url(#mg${size})"/></svg>`;
}

}
function heroRing(){

  for (let i = 0; i < 12; i++){

}
function wheelSvg(ch){
  const S = 600, C = 300, R1 = 292, R2 = 248, R3 = 92, RP = 212;
  const ref = ch.asc ?? 0; // yükselen solda
  const pt = (lon, r) => { const a = (180 + lon - ref) * Math.PI/180; return [C + r*Math.cos(a), C - r*Math.sin(a)]; };
  const css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim();
  const ink = col('--ink'), ink3 = col('--ink3'), line = col('--line'), gold = col('--gold');
  const elc = {fire:col('--fire'), earth:col('--earth'), air:col('--air'), water:col('--water')};
  let s = `<svg viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t('wheelAria')}" font-family="Manrope, sans-serif">`;
  s += `<circle cx="${C}" cy="${C}" r="${R1}" fill="none" stroke="${ink3}" stroke-opacity=".6"/>`;
  // burç dilimleri
  for (let i = 0; i < 12; i++){
    const a0 = i*30, a1 = a0 + 30;
    const [x0,y0] = pt(a0, R1), [x1,y1] = pt(a1, R1), [x2,y2] = pt(a1, R2), [x3,y3] = pt(a0, R2);
    s += `<path d="M${x0} ${y0} A${R1} ${R1} 0 0 0 ${x1} ${y1} L${x2} ${y2} A${R2} ${R2} 0 0 1 ${x3} ${y3}Z" fill="${elc[SIGNS[i].el]}" fill-opacity="${i%2?.10:.16}" stroke="${ink3}" stroke-opacity=".35"/>`;
    const [gx, gy] = pt(a0 + 15, (R1+R2)/2);
    s += `<text x="${gx}" y="${gy}" text-anchor="middle" dominant-baseline="central" font-size="22" fill="${elc[SIGNS[i].el]}" font-family="Segoe UI Symbol, Noto Sans Symbols, Apple Symbols, sans-serif">${SIGNS[i].g}${VS}</text>`;
  }
  // derece çentikleri
  for (let d = 0; d < 360; d += 5){ const [a,b] = pt(d, R2), [c2,d2] = pt(d, R2 - (d%10?4:8)); s += `<line x1="${a}" y1="${b}" x2="${c2}" y2="${d2}" stroke="${ink3}" stroke-opacity=".5"/>`; }
  s += `<circle cx="${C}" cy="${C}" r="${R2}" fill="none" stroke="${ink3}" stroke-opacity=".6"/>`;
  s += `<circle cx="${C}" cy="${C}" r="${R3}" fill="none" stroke="${ink3}" stroke-opacity=".5"/>`;
  // evler
  if (ch.cusps){
    ch.cusps.forEach((cu, i) => {
      const [a,b] = pt(cu, R3), [c2,d2] = pt(cu, R2);
      s += `<line x1="${a}" y1="${b}" x2="${c2}" y2="${d2}" stroke="${ink3}" stroke-opacity=".35" stroke-dasharray="3 4"/>`;
      const [nx, ny] = pt(cu + 15, R3 + 16);
      s += `<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="${ink3}">${i+1}</text>`;
    });
    // ASC-DSC ve MC-IC eksenleri
    [[ch.asc,'ASC'],[ch.mc,'MC']].forEach(([l, lab]) => {
      const [a,b] = pt(l, R1 + 4), [c2,d2] = pt(l + 180, R1 + 4);
      s += `<line x1="${a}" y1="${b}" x2="${c2}" y2="${d2}" stroke="${gold}" stroke-width="1.6" stroke-opacity=".85"/>`;
      const [tx, ty] = pt(l, R2 - 18);
      s += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" fill="${gold}">${lab}</text>`;
    });
  }
  // açı çizgileri
  ch.aspects.filter(a => a.k !== 'conj').forEach(a => {
    const [x1,y1] = pt(a.p1.lon, R3), [x2,y2] = pt(a.p2.lon, R3);
    const c3 = a.n === 'h' ? col('--teal') : col('--rose');
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c3}" stroke-opacity="${Math.max(.25, .85 - a.exact/10)}" stroke-width="${a.exact < 2 ? 1.6 : 1}"/>`;
  });
  // gezegenler (çakışma önleme)
  const sorted = [...ch.planets].sort((a, b) => a.lon - b.lon).map(p => ({p, d:p.lon}));
  for (let it = 0; it < 6; it++) for (let i = 0; i < sorted.length; i++){
    const a = sorted[i], b = sorted[(i+1) % sorted.length];
    let gap = norm(b.d - a.d); if (sorted.length < 2) break;
    if (gap < 8){ const push = (8 - gap)/2; a.d = norm(a.d - push); b.d = norm(b.d + push); }
  }
  sorted.forEach(({p, d}) => {
    const [t1x,t1y] = pt(p.lon, R2), [t2x,t2y] = pt(p.lon, R2 - 12);
    s += `<line x1="${t1x}" y1="${t1y}" x2="${t2x}" y2="${t2y}" stroke="${ink}" stroke-width="1.4"/>`;
    const [gx, gy] = pt(d, RP);
    s += `<circle cx="${gx}" cy="${gy}" r="15" fill="${col('--bg2')}" fill-opacity=".85" stroke="${line}"/>`;
    s += `<text x="${gx}" y="${gy}" text-anchor="middle" dominant-baseline="central" font-size="18" fill="${ink}" font-family="Segoe UI Symbol, Noto Sans Symbols, Apple Symbols, sans-serif">${p.g}${VS}</text>`;
    const [lx, ly] = pt(d, RP - 28);
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="${ink3}">${Math.floor(norm(p.lon)%30)}°${p.retro?'℞':''}</text>`;
  });
  s += `<circle cx="${C}" cy="${C}" r="3" fill="${gold}"/></svg>`;
  return s;
}

function periodKey(period, d=new Date()){
  if (period === 'day') return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  if (period === 'month') return `${d.getFullYear()}-${d.getMonth()}`;
  const t = new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return `w${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
}
function periodLabel(period, d=new Date()){
  if (period === 'day') return `${DAYS[d.getDay()]}, ${fmtDate(d)}`;
  if (period === 'month') return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const s = new Date(d); s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); const e = new Date(s); e.setDate(e.getDate() + 6);
  if (LANG === 'en') return s.getMonth() === e.getMonth() ? `${MONTHS[s.getMonth()]} ${s.getDate()}–${e.getDate()}` : `${dayMonth(s)} – ${dayMonth(e)}`;
  return s.getMonth() === e.getMonth() ? `${s.getDate()}–${e.getDate()} ${MONTHS[s.getMonth()]}` : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]}`;
}
function horoscope(si, period){
  const k = periodKey(period) + '|' + si + '|' + period;
  const h = n => hash(k + n);
  const focus = pick(POOL.focus, h('f'));
  const love = pick(POOL.love, h('l')), work = pick(POOL.work, h('w')), well = pick(POOL.well, h('h'));
  const sc = n => 2 + (h(n) % 4); // 2..5
  const main = t('horoMain', {word: t('word_' + period), focus, sign: SIGNS[si].tr, style: STYLE[si], when: pick(t('when'), h('m')), result: pick(t('result'), h('n'))});
  return {focus, love, work, well, s:{love:sc('sl'), work:sc('sw'), well:sc('sh')}, main, color: pick(COLORS, h('c')), num: 1 + h('u') % 99};
}

function cityInput(prefix, onPick){
  const inp = $('#' + prefix + 'City'), dd = $('#' + prefix + 'CityDD'), ok = $('#' + prefix + 'CityOk');
  let timer, items = [], hl = -1, ctrl;
  const close = () => { dd.classList.remove('open'); inp.setAttribute('aria-expanded','false'); hl = -1; };
  const choose = it => {
    inp.value = it.short; close();
    const tz = guessTz(it.cc, it.lon);
    ok.textContent = `✓ ${it.lat.toFixed(2)}°, ${it.lon.toFixed(2)}° · ${tz}`;
    onPick({city: it.short, lat: it.lat, lon: it.lon, tz});
  };
  inp.addEventListener('input', () => {
    clearTimeout(timer); ok.textContent = ''; onPick(null);
    const q = inp.value.trim(); if (q.length < 2) return close();
    timer = setTimeout(async () => {
      try {
        ctrl && ctrl.abort(); ctrl = new AbortController();
        dd.innerHTML = `<button disabled>${t('searching')}</button>`; dd.classList.add('open');
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&accept-language=${LANG}&q=${encodeURIComponent(q)}`, {signal: ctrl.signal});
        const data = await r.json();
        items = data.filter(d => ['city','town','village','administrative','municipality','suburb','hamlet','province','state'].includes(d.addresstype || d.type) || d.class === 'place' || d.class === 'boundary').map(d => {
          const a = d.address || {};
          const name = a.city || a.town || a.village || a.municipality || a.province || a.state || d.name || d.display_name.split(',')[0];
          const region = [a.province || a.state, a.country].filter(x => x && x !== name).join(', ');
          return {short: name + (a.country ? ', ' + a.country : ''), name, region, lat: +d.lat, lon: +d.lon, cc: a.country_code};
        });
        if (!items.length){ dd.innerHTML = `<button disabled>${t('noResults')}</button>`; return; }
        dd.innerHTML = items.map((it, i) => `<button type="button" role="option" data-i="${i}">${esc(it.name)}<small>${esc(it.region)}</small></button>`).join('');
        inp.setAttribute('aria-expanded','true');
      } catch (e) { if (e.name !== 'AbortError') dd.innerHTML = `<button disabled>${t('searchFail')}</button>`; }
    }, 380);
  });
  dd.addEventListener('mousedown', e => { const b = e.target.closest('[data-i]'); if (b){ e.preventDefault(); choose(items[+b.dataset.i]); } });
  inp.addEventListener('keydown', e => {
    const opts = $$('[data-i]', dd); if (!dd.classList.contains('open') || !opts.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length; opts.forEach((o, i) => o.classList.toggle('hl', i === hl)); }
    else if (e.key === 'Enter' && hl >= 0){ e.preventDefault(); choose(items[hl]); }
    else if (e.key === 'Escape') close();
  });
  inp.addEventListener('blur', () => setTimeout(close, 150));
}

function downloadPng(ch){
  const svg = $('#wheelBox svg'); if (!svg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const xml = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 1200; c.height = 1320;
    const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, 1200, 1200);
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim();
    x.font = '600 40px Fraunces, Georgia, serif'; x.textAlign = 'center';
    const p = ch.planets; const asc = ch.asc != null ? `  ·  ${t('rising')} ${SIGNS[signIdx(ch.asc)].tr}` : '';
    x.fillText(`${ch.input.name}  ·  ${t('sun')} ${SIGNS[p[0].sign].tr}  ·  ${t('moon')} ${SIGNS[p[1].sign].tr}${asc}`, 600, 1270);
    const fname = `${t('filePrefix')}-${(ch.input.name||'').toLowerCase().replace(/[^a-z0-9ğüşıöç]+/gi,'-')}.png`;
    const dataUrl = c.toDataURL('image/png');
    const FS = nativePlugin('Filesystem'), NS = nativePlugin('Share');
    if (FS && NS){
      FS.writeFile({path: fname, data: dataUrl.split(',')[1], directory: 'CACHE'})
        .then(res => NS.share({title: t('shareTitle'), files: [res.uri], dialogTitle: t('share')}))
        .catch(() => toast(t('imgFail')));
      return;
    }
    const a = document.createElement('a'); a.download = fname; a.href = dataUrl; a.click();
  };
  img.onerror = () => toast(t('imgFail'));
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}

function signCompat(a, b){
  const d = Math.min((a - b + 12) % 12, (b - a + 12) % 12);
  const base = [80, 58, 84, 52, 93, 48, 76][d];
  const txt = COMPAT_TXT[d];
  const ea = SIGNS[a].el, eb = SIGNS[b].el;
  const bonus = (ea === eb) ? 0 : ((['fire','air'].includes(ea) && ['fire','air'].includes(eb)) || (['earth','water'].includes(ea) && ['earth','water'].includes(eb))) ? 4 : -2;
  const score = Math.max(35, Math.min(98, base + bonus + (hash(`${Math.min(a,b)}-${Math.max(a,b)}`) % 5) - 2));
  return {score, txt};
}
function ringSvg(score){
  const r = 70, c = 2*Math.PI*r;

}

if (LANG === 'en') SYN_TXT = EN.syn;
function synText(a, b, asp){
  const key = [a.k, b.k].join('-'), rkey = [b.k, a.k].join('-');
  const st = SYN_TXT[key] || SYN_TXT[rkey];
  if (st) return asp.n === 'c' ? st[1] : st[0];
  if (a.k === 'Saturn' || b.k === 'Saturn') return t('synSat')[asp.n === 'c' ? 1 : 0];
  if (a.k === 'Jupiter' || b.k === 'Jupiter') return t('synJup')[asp.n === 'c' ? 1 : 0];
  return cap(t('aspLine', {a: a.short, b: b.short, asp: asp.tr.toLocaleLowerCase(LOCALE), d: asp.d}));
}
function synastry(A, B){
  const main = ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn'];
  const pa = A.planets.filter(p => main.includes(p.k)), pb = B.planets.filter(p => main.includes(p.k));
  const W = {Sun:1.5,Moon:1.5,Venus:1.5,Mars:1.3,Mercury:1,Jupiter:.8,Saturn:1};
  const cats = {love:0, comm:0, emo:0, long:0}, list = [];
  let total = 0;
  pa.forEach(a => pb.forEach(b => {
    const asp = findAspect(a.lon, b.lon, .85); if (!asp) return;
    const tight = 1 - asp.exact / (asp.orb * .85);
    let v = {conj:.8, tri:1, sext:.7, sq:-.6, opp:-.3}[asp.k];
    const pair = [a.k, b.k].sort().join('-');
    if (pair === 'Mars-Venus' && asp.n === 'c') v = .6;
    if ((a.k === 'Saturn' || b.k === 'Saturn') && asp.k === 'conj') v = .2;
    const w = W[a.k] * W[b.k] * tight * v;
    total += w;
    const has = k => a.k === k || b.k === k;
    if (has('Venus') || has('Mars') || pair === 'Moon-Sun') cats.love += w;
    if (has('Mercury')) cats.comm += w;
    if (has('Moon')) cats.emo += w;
    if (has('Saturn') || has('Jupiter') || pair === 'Sun-Sun' || pair === 'Moon-Sun') cats.long += w;
    list.push({a, b, asp, w: Math.abs(W[a.k] * W[b.k] * tight)});
  }));
  const sc = (x, base, k) => Math.max(30, Math.min(98, Math.round(base + x * k)));
  const signBonus = signCompat(A.planets[0].sign, B.planets[0].sign).score;
  const score = Math.round(sc(total, 58, 3.2) * .8 + signBonus * .2);
  list.sort((x, y) => y.w - x.w);
  return {score, cats:{love:sc(cats.love,60,6), comm:sc(cats.comm,62,7), emo:sc(cats.emo,60,6), long:sc(cats.long,58,6)}, list: list.slice(0, 7)};
}

  $('#savedList').addEventListener('click', e => {
    const list = store.get('asteria.charts', []);
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open){ const rec = list.find(c => c.id === t.dataset.open); location.hash = '#harita'; setTimeout(() => { loadIntoForm(rec); $('#natalForm').requestSubmit(); }, 30); }
    if (t.dataset.main){ list.forEach(c => c.main = c.id === t.dataset.main); store.set('asteria.charts', list); renderSaved(); renderHome(); toast(t('mainUpdated')); }
    if (t.dataset.del){ if (!confirm(t('confirmDel'))) return; const nl = list.filter(c => c.id !== t.dataset.del); if (nl.length && !nl.some(c => c.main)) nl[0].main = true; store.set('asteria.charts', nl); renderSaved(); renderHome(); }
  });
}

/* =========================================================
   YILDIZ ARKA PLANI
   ========================================================= */
function stars(){
  const c = $('#stars'), x = c.getContext('2d'); let W, H, pts = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const resize = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    pts = Array.from({length: Math.min(220, Math.round(innerWidth * innerHeight / 7000))}, () => ({x: Math.random()*W, y: Math.random()*H, r: (Math.random()*1.2 + .2) * devicePixelRatio, p: Math.random()*6.28, s: .4 + Math.random()*1.2})); };
  const draw = t => { x.clearRect(0, 0, W, H); for (const s of pts){ const a = reduce ? .6 : .35 + .45 * Math.sin(s.p + t/1000 * s.s); x.globalAlpha = a; x.fillStyle = '#fff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill(); } if (!reduce) requestAnimationFrame(draw); };
  resize(); addEventListener('resize', resize); requestAnimationFrame(draw);
}

/* =========================================================
   BAŞLAT
   ========================================================= */
function init(){
  applyStatic();
  $('#yr').textContent = new Date().getFullYear();
  $('#langBtn').onclick = () => setLang(LANG === 'tr' ? 'en' : 'tr');
  // Eski sürümün düz metin şifresini temizle
  try { const u = JSON.parse(localStorage.getItem('asteria-user') || 'null'); if (u && u.password){ delete u.password; localStorage.setItem('asteria-user', JSON.stringify(u)); } } catch {}
  const theme = store.get('asteria.theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; store.set('asteria.theme', t); if (state.lastChart && $('#wheelBox')) $('#wheelBox').innerHTML = wheelSvg(state.lastChart); };
  try { state.sky = computeSky(); } catch (e) { console.error(e); }
  const me = mainProfile();
  state.sign = me ? me.sun : (state.sky ? state.sky.sun.sign : 0);
  $('#signChips').addEventListener('click', e => { const b = e.target.closest('[data-sign]'); if (b){ history.replaceState(null, '', '#burclar/' + SIGNS[+b.dataset.sign].id); state.sign = +b.dataset.sign; renderHoroscope(); } });
  $$('.tab').forEach(t => t.addEventListener('click', () => { state.period = t.dataset.period; renderHoroscope(); }));
  stars(); renderHome(); initNatal(); initSyn(); initSaved();
  addEventListener('hashchange', route); route();
}
document.addEventListener('DOMContentLoaded', init);
</script>
