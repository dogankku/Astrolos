name: Android release (AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['store-listing/**', '*.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets – building an UNSIGNED bundle (sign it locally before uploading)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: astrolos-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish bundle to the 'builds' branch
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          mkdir -p /tmp/out && cp "$AAB" "/tmp/out/astrolos-${{ github.run_number }}.aab"
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Bundle from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
